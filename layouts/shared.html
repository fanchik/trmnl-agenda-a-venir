<!-- Shared stylesheet and responsive fitting used by all four layout tabs. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kweninlondon/trmnl-calendar-coming-up@abee2ff8f574b86c9bfcc7792b4820b7701bd21c/assets/coming-up.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fanchik/trmnl-agenda-a-venir@9f30c714dceb334c0fec2149f5acb22f786ce6a4/assets/agenda-fr.css">

<script>
(function () {
  function sizeColumns(layout) {
    // Reserve only the space the actual date/time text needs in CSS pixels.
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    if (!context) return;
    layout.querySelectorAll('table').forEach(function (table) {
      ['date', 'time'].forEach(function (name) {
        const cells = Array.from(table.querySelectorAll('.event-row:not([hidden]) .' + name));
        const col = table.querySelector('.agenda-' + name + '-col');
        if (!col || !cells.length) return;
        const width = Math.max(...cells.map(function (cell) {
          const type = getComputedStyle(cell);
          context.font = type.fontWeight + ' ' + type.fontSize + ' ' + type.fontFamily;
          return context.measureText(cell.textContent.trim()).width;
        }));
        col.style.width = Math.ceil(width + (layout.classList.contains('agenda-quadrant') ? 4 : 12)) + 'px';
      });
    });
    if (!layout.classList.contains('agenda-full')) {
      layout.querySelectorAll('.event-row:not([hidden]) .event').forEach(function (cell) {
        const title = cell.querySelector('.event-name');
        const label = cell.querySelector('.calendar-label');
        if (!title || !label) return;
        function textWidth(node, prefix) {
          const type = getComputedStyle(node);
          context.font = type.fontWeight + ' ' + type.fontSize + ' ' + type.fontFamily;
          return context.measureText((prefix || '') + node.textContent.trim()).width;
        }
        if (!title.hasAttribute('data-agenda-title')) title.setAttribute('data-agenda-title', title.textContent);
        const original = title.getAttribute('data-agenda-title');
        title.textContent = original;
        cell.classList.remove('calendar-inline', 'calendar-packed');
        const labelWidth = textWidth(label, ' · ') + 2;
        if (labelWidth >= cell.clientWidth) return;
        cell.classList.add('calendar-packed');
        if (textWidth(title) + labelWidth <= cell.clientWidth) {
          cell.classList.add('calendar-inline');
          return;
        }
        function titleFitsTwoLines() {
          const fragments = Array.from(title.getClientRects());
          const first = fragments[0], last = fragments[fragments.length - 1];
          if (!first || !last) return false;
          const zoom = cell.getBoundingClientRect().width / cell.offsetWidth;
          const budget = parseFloat(getComputedStyle(cell).lineHeight) * zoom * 2;
          return last.bottom <= first.top + budget + 1;
        }
        if (titleFitsTwoLines()) return;
        const characters = typeof Intl.Segmenter === 'function'
          ? Array.from(new Intl.Segmenter(undefined, {granularity: 'grapheme'}).segment(original), part => part.segment)
          : Array.from(original);
        let low = 0, high = characters.length;
        while (low < high) {
          const middle = Math.ceil((low + high) / 2);
          title.textContent = characters.slice(0, middle).join('').trimEnd() + '…';
          if (titleFitsTwoLines()) low = middle; else high = middle - 1;
        }
        let shortened = characters.slice(0, low).join('').trimEnd();
        const wordEnd = shortened.lastIndexOf(' ');
        if (wordEnd > shortened.length / 2) shortened = shortened.slice(0, wordEnd);
        title.textContent = shortened + '…';
      });
    }
  }
  function readableScale(layout) {
    const event = layout.querySelector('.event-row .event');
    if (!event) return 1;
    // Use the compact readable floor to find capacity before trying larger type.
    const minimum = layout.classList.contains('agenda-full') ? 18 : 14;
    return Math.min(1, minimum / parseFloat(getComputedStyle(event).fontSize));
  }
  function enlarge(layout, fits) {
    // Quadrant is deliberately compact even with only one or two events.
    if (layout.classList.contains('agenda-quadrant')) return;
    const titles = Array.from(layout.querySelectorAll('.event-row:not([hidden]) .event-name, .event-row:not([hidden]) .calendar-label'));
    const lines = node => Math.max(1, Math.round(node.scrollHeight / parseFloat(getComputedStyle(node).lineHeight)));
    const originalLines = titles.map(lines);
    const originalLengths = titles.map(node => node.textContent.length);
    const inlineCells = Array.from(layout.querySelectorAll('.event-row:not([hidden]) .calendar-inline'));
    const baseline = Number(layout.style.getPropertyValue('--agenda-boost')) || 1;
    // More readable type must not turn single-line names into wrapped names.
    for (const scale of [1.5, 1.25, 1.1, 1, 0.9, 0.8].filter(scale => scale > baseline)) {
      layout.style.setProperty('--agenda-boost', String(scale));
      sizeColumns(layout);
      const legible = Array.from(layout.querySelectorAll('.event-row:not([hidden]) .event')).every(cell => cell.getBoundingClientRect().width >= 70);
      const datesFit = Array.from(layout.querySelectorAll('.event-row:not([hidden]) .date, .event-row:not([hidden]) .time')).every(cell => cell.scrollWidth <= cell.clientWidth + 1);
      const namesFit = titles.every((node, index) => lines(node) <= originalLines[index] && node.textContent.length >= originalLengths[index])
        && inlineCells.every(cell => cell.classList.contains('calendar-inline'));
      if (legible && datesFit && namesFit && fits()) return;
    }
    layout.style.setProperty('--agenda-boost', String(baseline));
    sizeColumns(layout);
  }
  function fitCalendar() {
    document.querySelectorAll('.next-ten').forEach(function (root) {
      if (root.closest('.calendar-horizontal')) return;
      const table = root.querySelector('table');
      if (!table) return;
      const rows = Array.from(table.querySelectorAll('tr'));
      const events = rows.filter(row => row.classList.contains('event-row'));
      const layout = root.closest('.layout');
      const screen = root.closest('.screen') || layout.parentElement;
      const footer = layout.nextElementSibling && layout.nextElementSibling.classList.contains('title_bar')
        ? layout.nextElementSibling : layout.parentElement.querySelector('.title_bar');
      function updateCount(visible) {
        const targets = [root.querySelector('h1'), footer && footer.querySelector('.title')];
        targets.filter(Boolean).forEach(function (target) {
          const template = target.getAttribute('data-count-template');
          if (template && template.includes('{count}')) {
            target.textContent = template.replace(/\{count\}/g, String(visible));
          }
        });
      }
      layout.style.setProperty('--agenda-boost', '1');
      rows.forEach(row => { row.hidden = false; });
      layout.style.setProperty('--agenda-boost', String(readableScale(layout)));
      sizeColumns(layout);
      updateCount(events.length);
      if (!events.length) return;
      const bottom = Math.min(layout.getBoundingClientRect().bottom,
        footer ? footer.getBoundingClientRect().top : screen.getBoundingClientRect().bottom) - 8;
      if (table.getBoundingClientRect().bottom <= bottom) { enlarge(layout, () => table.getBoundingClientRect().bottom <= bottom); return; }
      let visible = events.length;
      while (visible > 0) {
        const firstHidden = rows.indexOf(events[visible - 1]);
        rows.slice(firstHidden).forEach(row => { row.hidden = true; });
        visible--;
        // Remove headings and gaps with no remaining event beneath them.
        let lastEvent = visible ? rows.indexOf(events[visible - 1]) : -1;
        rows.forEach((row, index) => { if (index > lastEvent) row.hidden = true; });
        updateCount(visible);
        sizeColumns(layout);
        if (table.getBoundingClientRect().bottom <= bottom) break;
      }
      enlarge(layout, () => table.getBoundingClientRect().bottom <= bottom);
    });
  }
  function fitHorizontal() {
    document.querySelectorAll('.calendar-horizontal').forEach(function (layout) {
      layout.style.setProperty('--agenda-boost', '1');
      const tables = Array.from(layout.querySelectorAll('table'));
      if (tables.length !== 2) return;
      if (!layout.calendarSourceRows) layout.calendarSourceRows = Array.from(layout.querySelectorAll('.event-row')).map(row => row.cloneNode(true));
      const source = layout.calendarSourceRows;
      layout.style.setProperty('--agenda-boost', String(readableScale(layout)));
      const screen = layout.closest('.screen') || layout.parentElement;
      const footer = layout.nextElementSibling && layout.nextElementSibling.classList.contains('title_bar')
        ? layout.nextElementSibling : layout.parentElement.querySelector('.title_bar');
      const grouped = layout.getAttribute('data-grouping') === 'true';
      function updateCount(count) {
        [layout.querySelector('h1'), footer && footer.querySelector('.title')].filter(Boolean).forEach(function (target) {
          const template = target.getAttribute('data-count-template');
          if (template && template.includes('{count}')) target.textContent = template.replace(/\{count\}/g, String(count));
        });
      }
      if (!source.length) { updateCount(0); return; }
      function fill(table, rows, continuedGroup) {
        Array.from(table.querySelectorAll('tr')).forEach(row => row.remove());
        let body = table.querySelector('tbody');
        if (!body) { body = document.createElement('tbody'); table.appendChild(body); }
        let previous = '';
        rows.forEach(function (row, index) {
          const group = row.getAttribute('data-group');
          if (grouped && group !== previous) {
            if (index) {
              const gap = document.createElement('tr'); gap.className = 'group-gap';
              const cell = document.createElement('td'); cell.colSpan = 3; cell.className = 'py--0 px--0'; gap.appendChild(cell); body.appendChild(gap);
            }
            const continuing = index === 0 && group === continuedGroup;
            const heading = document.createElement('tr'); heading.className = continuing ? 'section section-continuation' : 'section';
            const cell = document.createElement('th'); cell.colSpan = 3; cell.className = 'text--base lg:text--large text--left pt--1.5 pb--1 px--1.5';
            cell.textContent = group + (continuing ? ' (suite)' : '');
            heading.appendChild(cell); body.appendChild(heading); previous = group;
          }
          body.appendChild(row.cloneNode(true));
        });
      }
      // Keep the largest chronological prefix and find a split that fits both columns.
      // This avoids skipping events from the bottom of the left column.
      for (let count = source.length; count >= 0; count--) {
        const balanced = Math.ceil(count / 2);
        const splits = count > 1
          ? Array.from({length: count - 1}, (_, index) => index + 1).sort((a, b) => Math.abs(a - balanced) - Math.abs(b - balanced))
          : [balanced];
        let fits = false;
        for (const split of splits) {
          fill(tables[0], source.slice(0, split));
          fill(tables[1], source.slice(split, count), split ? source[split - 1].getAttribute('data-group') : undefined);
          updateCount(count);
          sizeColumns(layout);
          const bottom = Math.min(layout.getBoundingClientRect().bottom,
            footer ? footer.getBoundingClientRect().top : screen.getBoundingClientRect().bottom) - 8;
          if (tables.every(table => table.getBoundingClientRect().bottom <= bottom)) { fits = true; break; }
        }
        if (fits) {
          const bottom = Math.min(layout.getBoundingClientRect().bottom, footer ? footer.getBoundingClientRect().top : screen.getBoundingClientRect().bottom) - 8;
          enlarge(layout, () => tables.every(table => table.getBoundingClientRect().bottom <= bottom));
          break;
        }
      }
    });
  }
  function fitAll() { fitCalendar(); fitHorizontal(); }
  function ready() { fitAll(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready); else ready();
  window.addEventListener('resize', fitAll);
})();
</script>
